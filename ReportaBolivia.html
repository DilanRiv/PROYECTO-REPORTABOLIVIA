<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B6B4A"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ReportaBolivia"><meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>ReportaBolivia</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono&display=swap" rel="stylesheet">
<style>:root{--cr:#F7F5F0;--vs:#D8ECE2;--vd:#1B6B4A;--am:#E8B44A;--gr:#5B6572;--tn:#1C2530}
html{-webkit-text-size-adjust:100%}*{box-sizing:border-box}a,button,.card,.chip,.card-u,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--cr);color:var(--tn);font-family:'DM Mono',monospace;font-size:14px}
h1{font-family:Syne,sans-serif;font-weight:800;font-size:clamp(30px,6vw,48px);line-height:1;margin:8px 0 20px}h1 span{margin-left:.9em}
.logo{font-family:Syne,sans-serif;font-weight:800;font-size:52px;line-height:.9;text-align:center}.logo b{display:block;color:var(--vd);text-align:right;font-size:.6em;margin-top:2px}
.logo .pin{height:.85em;margin:0 .04em;vertical-align:-.05em}.logo.sm{font-size:26px;background:var(--cr);padding:10px;border-radius:10px;margin-bottom:14px}
.auth{max-width:380px;margin:0 auto;padding:30px 20px;display:flex;flex-direction:column;gap:14px;min-height:100vh;min-height:100dvh;justify-content:center;position:relative}
.top{position:absolute;top:16px;right:20px;cursor:pointer;font-weight:700}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;margin-top:6px}
input,textarea,select{font:inherit;padding:10px;border:1px solid #cfd3d6;border-radius:8px;background:#fff;color:var(--tn)}textarea{min-height:110px}
input[type=checkbox]{width:44px;height:24px;accent-color:var(--vd)}
.b{font:700 13px Syne,sans-serif;border:0;border-radius:8px;padding:13px 18px;cursor:pointer;color:#fff;min-height:44px}
.vd{background:var(--vd)}.am{background:var(--am);color:#fff}.tn{background:var(--tn)}.gr{background:var(--gr)}.ln{background:#fff;color:var(--tn);border:1px solid #cfd3d6}
.row{display:flex;gap:10px;margin-top:14px}.row .b{flex:1}.row.end{justify-content:flex-end}.row.end .b{flex:0 0 auto}
.shell{display:flex;min-height:100vh;min-height:100dvh}aside{width:230px;background:var(--vs);padding:16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh}
aside small{margin:8px 0;color:var(--gr);font-size:11px}aside a{padding:11px 12px;border-radius:8px;cursor:pointer;font-weight:700}aside a.on{background:var(--vd);color:#fff}
.me{margin-top:auto;position:relative}.card-u{display:flex;gap:10px;align-items:center;background:var(--cr);border-radius:10px;padding:10px;cursor:pointer}
.card-u i{width:32px;height:32px;border-radius:50%;background:var(--vd);color:#fff;display:grid;place-items:center;font-style:normal}
.pop{position:absolute;bottom:62px;left:0;right:0;background:#fff;border-radius:10px;box-shadow:0 4px 18px #0002;padding:6px}.pop a{display:block}.pop a svg{display:none}.red{color:#c0392b}.hide{display:none}
main{flex:1;padding:28px;max-width:1100px}.burger{display:none}
.panel{background:#fff;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;max-width:640px;box-shadow:0 1px 6px #0001}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:inherit;border:1px solid #bbb;background:#fff;border-radius:99px;padding:9px 14px;cursor:pointer}.chip.on{background:var(--vs);border-color:var(--vd)}
.sw{display:flex;justify-content:space-between;align-items:center}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.filtros input{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:0 1px 6px #0001}.card small{color:var(--gr)}.au{font-size:12px}.au em{color:var(--gr)}
.ft,.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 10px;border-radius:99px}.pen{background:#FBE8B8}.rev{background:#DCE8F7}.ate{background:var(--vs)}
.st{color:var(--am);font-size:16px;letter-spacing:1px}
.vote button{font-size:30px;background:none;border:0;color:#ccc;cursor:pointer;padding:2px}.vote button.on{color:var(--am)}
iframe{width:100%;height:220px;border:0;border-radius:10px}.foto{max-width:100%;border-radius:10px}#pv{max-width:200px;border-radius:8px}
.bar{background:var(--vs);border-radius:6px;height:18px;margin:4px 0}.bar i{display:block;height:100%;background:var(--vd);border-radius:6px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tn);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:9}#toast.show{opacity:1}
@media(min-width:821px){
body.lgbg{background:#F5F5F5}
.lg{min-height:100vh;min-height:100dvh;display:flex;align-items:center;padding:24px 0}
.lgband{width:100%;background:#F7F5F0;border-top:1px solid #111;border-bottom:1px solid #111;padding:6px 18px 44px}
.logo.lgl{background:#F2F3EE;font-size:72px;padding:60px 0 24px;border-radius:0;margin:0 auto;max-width:640px}
.logo.lgl .lw{display:inline-block}.logo.lgl b{font-size:.52em}.logo.lgl .pin{height:1.05em;margin:0 .02em;vertical-align:-.2em}.logo.lgl .pin circle{fill:#F2F3EE}
.lgf{width:380px;max-width:100%;margin:26px auto 0}
.lgr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.lg label{display:block;margin:0;font:800 19px Syne,sans-serif;color:var(--tn);white-space:nowrap}
.lg input{width:50%;height:32px;padding:4px 8px;border:1.5px solid #9C9F99;border-radius:4px;background:#FAFAF8}
.lgb{display:flex;justify-content:center;gap:24px;margin-top:34px}
.lgbtn{font:700 12px Arial,Helvetica,sans-serif;color:#fff;border:0;border-radius:4px;width:112px;height:34px;cursor:pointer}
.pop{bottom:calc(100% + 12px);padding:0;border:1.5px solid #B9D5C9;border-radius:22px;box-shadow:0 8px 24px rgba(27,107,74,.14);overflow:hidden}
aside .pop a{display:flex;align-items:center;gap:14px;padding:16px;border-radius:0;position:relative;font:400 16px/1.2 Roboto,Arial,Helvetica,sans-serif;color:#1C2530}
aside .pop a svg{display:block;width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
aside .pop a .ic-u{color:#1B6B4A}aside .pop a.red{color:#A33A3A}
aside .pop a+a::before{content:"";position:absolute;top:0;left:16px;right:0;height:1.5px;background:#E3E9E6}
}
@media(max-width:820px){aside{position:fixed;left:-250px;z-index:5;transition:.25s}aside.open{left:0}.burger{display:block;background:none;border:0;font-size:26px}main{padding:16px}}
</style></head>
<body><div id="app"></div><div id="toast"></div><script>// ReportaBolivia - lógica de interfaz (SPA). Los datos se guardan en el servidor (data/).
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAT=['Calle dañada','Basura','Luminaria','Fuga de agua','Otro'],EST=['Pendiente','En revisión','Atendido'],ECL={'Pendiente':'pen','En revisión':'rev','Atendido':'ate'};
let token=localStorage.rb||'',user=null,nuevo={},L=[],modo='';
const rapi=async(p,m='GET',b)=>{const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error de conexión');return j};

// ===== MODO LOCAL: si no hay servidor Node, todo funciona guardando en este navegador =====
let LOCAL=false;
let modeReady=Promise.resolve();
const api=async(p,m,b)=>{await modeReady;return LOCAL?lapi(p,m||'GET',b||{}):rapi(p,m,b)};
const hs=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
const sv=d=>localStorage.rbdb=JSON.stringify(d);
const ldb=()=>{let d;try{d=JSON.parse(localStorage.rbdb)}catch{}if(!d){d={U:[{id:1,usuario:'admin',nombre:'Administración',apellido:'',rol:'admin',pass:hs('admin123')}],R:[],log:''};sv(d)}return d};
const cl=(s,n=500)=>String(s||'').replace(/[\t\r\n]+/g,' ').trim().slice(0,n);
async function lapi(p,m,b){const d=ldb(),{U,R}=d,E=t=>{throw new Error(t)},now=()=>new Date().toISOString();
 const me=x=>({id:x.id,usuario:x.usuario,nombre:x.nombre,apellido:x.apellido,rol:x.rol,reportes:R.filter(r=>r.uid==x.id).length});
 const u=U.find(x=>'L'+x.id==token),adm=u&&u.rol=='admin';
 const view=r=>{const v=Object.values(r.votos),au=U.find(x=>x.id==r.uid),mine=u.id==r.uid;return{id:r.id,codigo:r.codigo,desc:r.desc,cat:r.cat,estado:r.estado,nota:r.nota,publico:r.publico,fecha:r.fecha,lat:r.lat,lng:r.lng,foto:r.foto,barrio:r.barrio,prom:v.length?+(v.reduce((a,c)=>a+c,0)/v.length).toFixed(1):0,n:v.length,miVoto:r.votos[u.id]||0,mine,autor:(adm||mine||r.publico)&&au?(au.nombre+' '+au.apellido).trim():'Anónimo'}};
 const log=(...a)=>{d.log+=a.join('\t')+'\n'};
 if(p=='/registro'){const n=cl(b.nombre,40),a=cl(b.apellido,40),us=cl(b.usuario,24);
  if(!n||!a||!/^\w{3,24}$/.test(us)||String(b.pass||'').length<4)E('Completa todo (usuario 3-24 letras/números, contraseña mínimo 4)');
  if(U.find(x=>x.usuario.toLowerCase()==us.toLowerCase()))E('Ese usuario ya existe');
  U.push({id:Date.now(),usuario:us,nombre:n,apellido:a,rol:'usuario',pass:hs(String(b.pass))});sv(d);return{ok:1}}
 if(p=='/login'){const x=U.find(v=>v.usuario.toLowerCase()==cl(b.usuario,24).toLowerCase());if(!x||x.pass!=hs(String(b.pass||'')))E('Usuario o contraseña incorrectos');return{token:'L'+x.id,user:me(x)}}
 if(!u)E('Inicia sesión');
 if(p=='/yo')return me(u);
 if(p=='/reportes'&&m=='GET'){const v=b.ver;if(v=='todos'&&!adm)E('Solo administración');return R.filter(r=>v=='mios'?r.uid==u.id:v=='otros'?r.uid!=u.id:adm).map(view)}
 if(p=='/reportes'&&m=='POST'){if(adm)E('El administrador no crea reportes');const t=cl(b.desc,600),lat=+b.lat,lng=+b.lng;
  if(!t||!CAT.includes(b.cat)||b.lat==null||!isFinite(lat)||!isFinite(lng))E('Falta descripción, categoría o ubicación');
  const r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),codigo:'RB-'+String(R.length+1).padStart(5,'0'),uid:u.id,desc:t,cat:b.cat,lat,lng,barrio:cl(b.barrio,60),foto:b.foto||'',publico:!!b.publico,estado:'Pendiente',nota:'',fecha:now(),votos:{}};
  R.push(r);log('NUEVO',r.codigo,r.fecha,u.usuario,r.cat,r.publico?1:0,lat,lng,r.estado,t);sv(d);return view(r)}
 const mt=/^\/reportes\/(\w+)(\/voto)?$/.exec(p);
 if(mt){const r=R.find(x=>x.id==mt[1]);if(!r)E('No existe el reporte');
  if(mt[2]){if(adm||r.uid==u.id)E('No puedes calificar este reporte');const s=Math.round(+b.estrellas);if(!(s>=1&&s<=5))E('Elige de 1 a 5 estrellas');r.votos[u.id]=s;log('VOTO',r.codigo,now(),u.usuario,s);sv(d);return view(r)}
  if(m=='GET')return view(r);
  if(m=='PUT'){if(!adm)E('Solo administración');if(EST.includes(b.estado)&&b.estado!=r.estado){r.estado=b.estado;log('ESTADO',r.codigo,now(),u.usuario,r.estado)}
   if(CAT.includes(b.cat))r.cat=b.cat;r.nota=cl(b.nota,400);if(typeof b.publico=='boolean')r.publico=b.publico;sv(d);return view(r)}
  if(m=='DELETE'&&adm){d.R=R.filter(x=>x!=r);log('BORRADO',r.codigo,now(),u.usuario);sv(d);return{ok:1}}}
 E('No encontrado')}
const toast=t=>{const e=$('#toast');e.textContent=t;e.className='show';setTimeout(()=>e.className='',3200)};
const stars=p=>'★'.repeat(Math.round(p))+'☆'.repeat(5-Math.round(p)),titulo=r=>r.desc.length>38?r.desc.slice(0,38)+'…':r.desc;
const fmt=d=>new Date(d).toLocaleString('es-BO',{timeZone:'America/La_Paz',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const logo=c=>`<div class="logo ${c||''}"><span class="lw">Rep<svg class="pin" viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.2 0 11.6 0 20 12 30 12 30s12-10 12-18.4C24 5.2 18.6 0 12 0z" fill="#1B6B4A"/><circle cx="12" cy="11.5" r="4.5" fill="#F7F5F0"/></svg>rta<b>Bolivia</b></span></div>`;
function shell(h,act){const adm=user.rol=='admin',nav=adm?[['todos','▦','Todos los reportes'],['stats','◔','Estadísticas']]:[['nuevo','＋','Nuevo reporte'],['otros','▦','Otros reportes'],['mios','▤','Mis reportes']];
 $('#app').innerHTML=`<div class="shell"><aside id="side">${logo('sm')}<small>NAVEGACIÓN</small>${nav.map(n=>`<a class="${act==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</a>`).join('')}<a onclick="go('menu')">⌂ Menú</a>
 <div class="me"><div id="pop" class="pop hide"><a onclick="go('perfil')"><svg class="ic-u" viewBox="0 0 48 48"><circle cx="24" cy="14" r="8"/><path d="M7 44c0-9.5 7.5-15 17-15s17 5.5 17 15"/></svg>Mi perfil</a><a class="red" onclick="salir()"><svg viewBox="0 0 48 48"><path d="M20 5H8a2 2 0 0 0-2 2v34a2 2 0 0 0 2 2h12"/><path d="M18 24h26M33 13l11 11-11 11"/></svg>Cerrar sesión</a></div><div class="card-u" onclick="$('#pop').classList.toggle('hide')"><i>${esc(user.nombre[0])}</i><span>${esc(user.nombre)} ${esc(user.apellido)}<br><small>${adm?'Administración':'Mi cuenta'}</small></span></div></div></aside>
 <main><button class="burger" onclick="$('#side').classList.toggle('open')">☰</button>${h}</main></div>`}
function login(){if(!matchMedia('(min-width:821px)').matches){$('#app').innerHTML=`<section class="auth">${logo()}<label>Usuario :<input id="u"></label><label>Contraseña :<input id="p" type="password" onkeydown="event.key=='Enter'&&entrar()"></label><div class="row"><button class="b am" onclick="go('registro')">Registrarse</button><button class="b vd" onclick="entrar()">Iniciar sesión</button></div></section>`;return}
 $('#app').innerHTML=`<section class="lg"><div class="lgband">${logo('lgl')}<div class="lgf"><div class="lgr"><label for="u">Usuario :</label><input id="u" autocomplete="username" autocapitalize="none" autocorrect="off"></div><div class="lgr"><label for="p">Contraseña :</label><input id="p" type="password" autocomplete="current-password" onkeydown="event.key=='Enter'&&entrar()"></div><div class="lgb"><button class="lgbtn am" onclick="go('registro')">Registrarse</button><button class="lgbtn vd" onclick="entrar()">Iniciar sesión</button></div></div></div></section>`}
async function entrar(){try{const r=await api('/login','POST',{usuario:$('#u').value,pass:$('#p').value});token=r.token;localStorage.rb=token;user=r.user;go('menu')}catch(e){toast(e.message)}}
function registro(){$('#app').innerHTML=`<section class="auth"><h1>Registrar</h1><label>Nombre completo :<input id="n"></label><label>Apellido completo :<input id="a"></label><label>Usuario :<input id="u"></label><label>Contraseña :<input id="p" type="password"></label><label>Confirmar contraseña :<input id="p2" type="password"></label><div class="row"><button class="b tn" onclick="go('login')">Volver</button><button class="b am" onclick="registrar()">Registrar</button></div></section>`}
async function registrar(){if($('#p').value!=$('#p2').value)return toast('Las contraseñas no coinciden');
 try{await api('/registro','POST',{nombre:$('#n').value,apellido:$('#a').value,usuario:$('#u').value,pass:$('#p').value});toast('Cuenta creada. Inicia sesión');go('login')}catch(e){toast(e.message)}}
function salir(){token='';localStorage.removeItem('rb');user=null;go('login')}
function menu(){const a=user.rol=='admin';$('#app').innerHTML=`<section class="auth"><div class="top" onclick="go('perfil')">${esc(a?'Administración':user.usuario)} 👤</div>${logo()}${a?`<button class="b vd" onclick="go('todos')">Reportes</button><button class="b tn" onclick="go('stats')">Estadísticas</button>`:`<button class="b vd" onclick="go('nuevo')">Nuevo reporte</button><button class="b tn" onclick="go('mios')">Mis reportes</button><button class="b gr" onclick="go('otros')">Otros reportes</button>`}<button class="b ln" onclick="salir()">Cerrar sesión</button></section>`}
function perfil(){$('#app').innerHTML=`<section class="auth"><h1 style="text-align:center">${esc(user.usuario)}</h1><p><b>Nombre completo :</b> ${esc(user.nombre)}</p><p><b>Apellido completo :</b> ${esc(user.apellido)}</p><p><b>Reportes :</b> ${user.reportes}</p><button class="b tn" onclick="go('menu')">Volver</button></section>`}
function vnuevo(){nuevo={cat:'',lat:null,lng:null,foto:''};
 shell(`<h1>Nuevo<br><span>reporte</span></h1><div class="panel"><label>Descripción<textarea id="d" placeholder="Describe el problema"></textarea></label><label>Categoría</label><div class="chips">${CAT.map(c=>`<button class="chip" onclick="selCat(this,'${c}')">${c}</button>`).join('')}</div>
 <label>Barrio / zona (opcional)<input id="bar"></label><button class="b ln" id="gps" onclick="ubicar()">📍 Usar mi ubicación</button><label>Fotografía (opcional)<input type="file" id="ft" accept="image/*" onchange="foto(this)"></label><img id="pv" class="hide">
 <div class="sw"><span>Público (mostrar mi nombre)</span><input type="checkbox" id="pu" checked></div><small>Si lo desactivas, tu reporte aparece como "Anónimo" para los demás. Solo la administración ve quién lo envió.</small>
 <div class="row"><button class="b tn" onclick="go('menu')">Volver</button><button class="b vd" onclick="enviar()">Enviar reporte</button></div></div>`,'nuevo')}
function selCat(b,c){nuevo.cat=c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==b))}
function ubicar(){if(!navigator.geolocation)return toast('Tu navegador no soporta GPS');$('#gps').textContent='Buscando ubicación…';
 navigator.geolocation.getCurrentPosition(p=>{nuevo.lat=p.coords.latitude;nuevo.lng=p.coords.longitude;$('#gps').textContent=`📍 ${nuevo.lat.toFixed(5)}, ${nuevo.lng.toFixed(5)}`},()=>{const t=prompt('No se pudo usar el GPS. Escribe tu ubicación como latitud,longitud (ej. Santa Cruz):','-17.7833,-63.1821');const q=(t||'').split(',').map(Number);if(q.length==2&&q.every(isFinite)){nuevo.lat=q[0];nuevo.lng=q[1];$('#gps').textContent=`📍 ${q[0].toFixed(5)}, ${q[1].toFixed(5)}`}else $('#gps').textContent='📍 Usar mi ubicación'},{enableHighAccuracy:true,timeout:12000})}
function foto(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);nuevo.foto=c.toDataURL('image/jpeg',.7);$('#pv').src=nuevo.foto;$('#pv').className=''};im.src=URL.createObjectURL(f)}
async function enviar(){const d=$('#d').value.trim();if(!d)return toast('Escribe la descripción');if(!nuevo.cat)return toast('Elige una categoría');if(nuevo.lat==null)return toast('Pulsa "Usar mi ubicación"');
 try{await api('/reportes','POST',{desc:d,cat:nuevo.cat,lat:nuevo.lat,lng:nuevo.lng,foto:nuevo.foto,barrio:$('#bar').value,publico:$('#pu').checked});user.reportes++;go('enviado')}catch(e){toast(e.message)}}
function enviado(){$('#app').innerHTML=`<section class="auth" style="text-align:center"><h1>Reporte<br><span>Enviado</span></h1><h2 style="font-family:Syne">Gracias !!</h2><button class="b vd" onclick="go('menu')">Volver al Menú</button></section>`}
async function vlista(m){modo=m;try{L=await(LOCAL?api('/reportes','GET',{ver:m}):api('/reportes?ver='+m))}catch(e){return toast(e.message)}const adm=user.rol=='admin';
 shell(`<h1>${{mios:'Mis<br><span>reportes</span>',otros:'Otros<br><span>reportes</span>',todos:'Reportes'}[m]}</h1><div class="filtros"><input id="q" placeholder="Buscar: palabra, barrio o código" oninput="pintar()"><select id="fc" onchange="pintar()"><option value="">Categorías</option>${CAT.map(c=>`<option>${c}</option>`).join('')}</select><select id="fe" onchange="pintar()"><option value="">Estados</option>${EST.map(c=>`<option>${c}</option>`).join('')}</select><select id="fo" onchange="pintar()"><option value="f">Más recientes</option><option value="s">Más confiables</option></select></div><div id="grid" class="grid"></div>
 <div class="row end"><button class="b tn" onclick="go('menu')">Volver</button>${adm?`<button class="b vd" onclick="descargar()">Descargar archivo</button>`:`<button class="b vd" onclick="go('nuevo')">Nuevo reporte</button>`}</div>`,m);pintar()}
function pintar(){const q=$('#q').value.toLowerCase(),c=$('#fc').value,e=$('#fe').value,l=L.filter(r=>(!c||r.cat==c)&&(!e||r.estado==e)&&(r.desc+r.barrio+r.codigo).toLowerCase().includes(q));
 l.sort($('#fo').value=='s'?(a,b)=>b.prom-a.prom||b.n-a.n:(a,b)=>b.fecha.localeCompare(a.fecha));
 $('#grid').innerHTML=l.map(r=>`<div class="card" onclick="go('det','${r.id}')">${modo!='mios'?`<div class="au">👤 ${esc(r.autor)}${modo=='todos'&&!r.publico?' <em>(privado)</em>':''}</div>`:''}<b>${esc(titulo(r))}</b><small>${esc(r.cat)} · ${r.codigo}</small><div class="ft"><span class="tag ${ECL[r.estado]}">${r.estado}</span><span class="st">${stars(r.prom)} <small>${r.n?r.prom:''}</small></span></div></div>`).join('')||'<p>No hay reportes.</p>'}
async function vdet(id){let r;try{r=await api('/reportes/'+id)}catch(e){return toast(e.message)}const adm=user.rol=='admin';
 const vot=!adm&&!r.mine?`<div class="vote">¿Qué tan confiable es? ${[1,2,3,4,5].map(i=>`<button class="${i<=r.miVoto?'on':''}" onclick="votar('${r.id}',${i})">★</button>`).join('')}</div>`:'';
 const ed=adm?`<label>Categoría<select id="ec">${CAT.map(c=>`<option ${c==r.cat?'selected':''}>${c}</option>`).join('')}</select></label><label>Estado<select id="ee">${EST.map(c=>`<option ${c==r.estado?'selected':''}>${c}</option>`).join('')}</select></label><label>Nota de gestión<textarea id="en">${esc(r.nota)}</textarea></label><div class="sw"><span>Público</span><input type="checkbox" id="ep" ${r.publico?'checked':''}></div><div class="row"><button class="b tn" onclick="go('todos')">Volver</button><button class="b vd" onclick="guardar('${r.id}')">Actualizar reporte</button></div><button class="b ln red" onclick="borrar('${r.id}')">Eliminar reporte</button>`
 :`<p><b>Nota de administración:</b> ${esc(r.nota)||'—'}</p><div class="row"><button class="b tn" onclick="go('${r.mine?'mios':'otros'}')">Volver</button></div>`;
 shell(`<h1>${esc(titulo(r))}</h1><div class="panel"><div class="meta"><span class="tag ${ECL[r.estado]}">${r.estado}</span><span class="st">${stars(r.prom)} ${r.prom} (${r.n})</span></div><small>${r.codigo} · ${fmt(r.fecha)} · ${esc(r.cat)}${r.barrio?' · '+esc(r.barrio):''}</small>
 <p>Enviado por: <b>${esc(r.autor)}</b>${!r.publico?' 🔒 <small>Privado: los demás lo ven como Anónimo</small>':''}</p><p>${esc(r.desc)}</p>${r.foto?`<img class="foto" src="${r.foto}">`:''}
 <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${r.lng-.004},${r.lat-.003},${r.lng+.004},${r.lat+.003}&marker=${r.lat},${r.lng}"></iframe>${vot}${ed}</div>`,adm?'todos':r.mine?'mios':'otros')}
async function votar(id,s){try{await api(`/reportes/${id}/voto`,'POST',{estrellas:s});toast('¡Gracias por calificar!');vdet(id)}catch(e){toast(e.message)}}
async function guardar(id){try{await api('/reportes/'+id,'PUT',{cat:$('#ec').value,estado:$('#ee').value,nota:$('#en').value,publico:$('#ep').checked});toast('Reporte actualizado');vdet(id)}catch(e){toast(e.message)}}
async function borrar(id){if(!confirm('¿Eliminar este reporte?'))return;try{await api('/reportes/'+id,'DELETE');go('todos')}catch(e){toast(e.message)}}
async function descargar(){const a=document.createElement('a');a.href=URL.createObjectURL(LOCAL?new Blob([ldb().log],{type:'text/plain'}):await(await fetch('/api/archivo',{headers:{Authorization:'Bearer '+token}})).blob());a.download='reportes.txt';a.click()}
async function stats(){try{L=await(LOCAL?api('/reportes','GET',{ver:'todos'}):api('/reportes?ver=todos'))}catch(e){return toast(e.message)}
 const cnt=(arr,f)=>arr.map(k=>[k,L.filter(r=>f(r)==k).length]),mx=Math.max(1,L.length),barras=a=>a.map(([k,n])=>`<div>${k}: <b>${n}</b><div class="bar"><i style="width:${n/mx*100}%"></i></div></div>`).join('');
 const v=L.filter(r=>r.n),pr=v.length?(v.reduce((s,r)=>s+r.prom,0)/v.length).toFixed(1):'—';
 shell(`<h1>Estadísticas</h1><div class="panel"><p>Total de reportes: <b>${L.length}</b> · Públicos: <b>${L.filter(r=>r.publico).length}</b> · Privados: <b>${L.filter(r=>!r.publico).length}</b></p><p>Confiabilidad promedio: <b>${pr} ★</b></p><h3>Por categoría</h3>${barras(cnt(CAT,r=>r.cat))}<h3>Por estado</h3>${barras(cnt(EST,r=>r.estado))}<button class="b vd" onclick="descargar()">Descargar archivo de reportes</button></div>`,'stats')}
const V={login,registro,menu,perfil,enviado,nuevo:vnuevo,mios:()=>vlista('mios'),otros:()=>vlista('otros'),todos:()=>vlista('todos'),det:vdet,stats};
function go(v,a){scrollTo(0,0);document.body.classList.toggle('lgbg',v=='login');V[v](a)}
document.addEventListener('click',e=>{const p=$('#pop');if(p&&!e.target.closest('.me'))p.classList.add('hide')});
modeReady=(async()=>{try{const r=await fetch('/api/yo');LOCAL=!(r.headers.get('content-type')||'').includes('json')}catch{LOCAL=true}
 if(LOCAL)setTimeout(()=>toast('Modo sin servidor: datos guardados en este navegador (admin / admin123)'),300)})();
if(!token)go('login');else(async()=>{try{user=await api('/yo');go('menu')}catch{go('login')}})();
</script></body></html>
